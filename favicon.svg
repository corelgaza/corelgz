<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Santri Journey">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#3A7D5C"/>
      <stop offset="55%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#152E24"/>
    </radialGradient>
    <linearGradient id="pageL" x1="16" y1="10" x2="7" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B7E4C7"/>
    </linearGradient>
    <linearGradient id="pageR" x1="16" y1="10" x2="25" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FFF4"/>
      <stop offset="1" stop-color="#95D5B2"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="16" y1="6" x2="16" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E6A8"/>
      <stop offset="1" stop-color="#B8942E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Buku terbuka — belajar & perjalanan santri -->
  <g filter="url(#soft)">
    <path
      fill="url(#pageL)"
      d="M16 10.2C12.2 10.2 7.8 12.4 7.8 16.8c0 2.8 3.2 4.6 8.2 5.4V10.2z"
    />
    <path
      fill="url(#pageR)"
      d="M16 10.2c3.8 0 8.2 2.2 8.2 6.6 0 2.8-3.2 4.6-8.2 5.4V10.2z"
    />
  </g>

  <!-- Punggung buku -->
  <path fill="#143328" d="M15.35 10.2h1.3v12.1h-1.3z"/>
  <path fill="#1B4332" opacity="0.5" d="M15.35 10.2h0.45v12.1h-0.45z"/>

  <!-- Garis halaman (detail halus) -->
  <path
    fill="none"
    stroke="#2D6A4F"
    stroke-width="0.35"
    stroke-linecap="round"
    opacity="0.55"
    d="M10.5 14.2h4.2M10.8 16.4h3.6M11.2 18.5h3"
  />
  <path
    fill="none"
    stroke="#2D6A4F"
    stroke-width="0.35"
    stroke-linecap="round"
    opacity="0.55"
    d="M21.5 14.2h-4.2M21.2 16.4h-3.6M20.8 18.5h-3"
  />

  <!-- Bookmark emas -->
  <path fill="url(#ribbon)" d="M16 6.4v5.4l-1.85-1.45L16 11l1.85-1.45L16 6.4z"/>

  <!-- Highlight atas -->
  <ellipse cx="16" cy="7.2" rx="5.5" ry="1.1" fill="#FFFFFF" opacity="0.07"/>
</svg>
